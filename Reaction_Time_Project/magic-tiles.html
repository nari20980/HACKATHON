<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcade Magic Tiles — Tap Falling Tiles in Rhythm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="magic-tiles.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="orb orb-cyan" aria-hidden="true"></div>
  <div class="orb orb-violet" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">🎹</div>
      <div>
        <h1>Arcade <span>Magic Tiles</span></h1>
        <p>Tap falling tiles or press D / F / J / K (or 1–4) as they cross the hit line</p>
      </div>
    </div>

    <nav class="nav-actions" aria-label="Page Navigation">
      <a class="nav-link" href="main.html">🏠 Home</a>
      <a class="nav-link" href="mini-golf.html">⛳ Mini Golf</a>
      <a class="nav-link" href="bowling-game.html">🎳 Bowling</a>
      <a class="nav-link" href="quests.html">📜 Quests</a>
      <a class="nav-link" href="shop.html">🛒 Shop</a>
    </nav>
  </header>

  <main class="game-wrap">
    <section class="game-panel glass" aria-labelledby="tilesHeading">
      <div class="panel-top">
        <div>
          <span class="tag tag-violet">RHYTHM TILES</span>
          <h2 id="tilesHeading">Magic Tiles</h2>
        </div>

        <div class="stats-row">
          <div class="stat-box"><span>SCORE</span><strong id="tilesScore">0</strong></div>
          <div class="stat-box"><span>STREAK</span><strong id="tilesStreak">0</strong></div>
          <div class="stat-box"><span>BEST</span><strong id="tilesBest">0</strong></div>
        </div>
      </div>

      <div class="stage-box">
        <canvas id="tilesCanvas" width="320" height="440" aria-label="Magic tiles track"></canvas>
        <div class="lane-keys" id="laneKeys">
          <button type="button" class="lane-btn" data-lane="0">D / 1</button>
          <button type="button" class="lane-btn" data-lane="1">F / 2</button>
          <button type="button" class="lane-btn" data-lane="2">J / 3</button>
          <button type="button" class="lane-btn" data-lane="3">K / 4</button>
        </div>
      </div>

      <button type="button" class="btn-primary" id="btnTilesStart">Start / Restart</button>

      <p class="status-msg" id="tilesStatus" role="status" aria-live="polite">
        Hit the glowing tiles before they pass the bottom line! Score 15+ points for XP &amp; Coins.
      </p>
    </section>
  </main>

  <script src="arcade-quests.js"></script>
  <script src="magic-tiles.js"></script>
</body>
</html>
