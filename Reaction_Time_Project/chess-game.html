<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcade Chess — Play vs AI or 2 Players</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="chess-game.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="orb orb-cyan" aria-hidden="true"></div>
  <div class="orb orb-violet" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">♟️</div>
      <div>
        <h1>Arcade <span>Chess</span></h1>
        <p>Select a piece to view legal moves, play vs AI or 2P, and capture the King</p>
      </div>
    </div>

    <nav class="nav-actions" aria-label="Page Navigation">
      <a class="nav-link" href="main.html">🏠 Home</a>
      <a class="nav-link" href="tetris-game.html">🟦 Tetris</a>
      <a class="nav-link" href="sudoku-game.html">🔢 Sudoku</a>
      <a class="nav-link" href="tictactoe-game.html">⭕ Tic-Tac-Toe</a>
      <a class="nav-link" href="quests.html">📜 Quests</a>
      <a class="nav-link" href="shop.html">🛒 Shop</a>
    </nav>
  </header>

  <main class="game-wrap">
    <section class="game-panel glass" aria-labelledby="chessHeading">
      <div class="panel-top">
        <div>
          <span class="tag tag-violet">STRATEGY BOARD</span>
          <h2 id="chessHeading">8×8 Chess Arena</h2>
        </div>

        <div class="top-actions">
          <button type="button" class="btn-secondary active" id="btnModeAi">vs AI</button>
          <button type="button" class="btn-secondary" id="btnMode2p">2 Players</button>
          <button type="button" class="btn-primary" id="btnResetChess">New Game</button>
        </div>
      </div>

      <div class="chess-board" id="chessBoard" role="grid" aria-label="Chess board"></div>

      <p class="status-msg" id="chessStatus" role="status" aria-live="polite">
        White's turn. Click a White piece to highlight moves. Win to earn +35 XP &amp; +15 Coins!
      </p>
    </section>
  </main>

  <script src="arcade-quests.js"></script>
  <script src="chess-game.js"></script>
</body>
</html>
